<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Szerencsekerék – Basic Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body class="lobby-active">
  <svg id="lobbyLightFx" class="lobby-light-fx"
       viewBox="0 0 1672 941"
       preserveAspectRatio="xMidYMid slice"
       aria-hidden="true"
       focusable="false">
    <defs>
      <filter id="lobbyBulbGlow" x="-250%" y="-250%" width="600%" height="600%">
        <feGaussianBlur stdDeviation="7" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- A háttérkép jobb oldali kerekének nagy izzói.
         A sötétítő körök miatt a két fázis ténylegesen felváltva látszik. -->
    <g class="lobby-bulb-dimmers">
      <circle cx="1363" cy="13"  r="13" />
      <circle cx="1311" cy="89"  r="13" />
      <circle cx="1279" cy="174" r="13" />
      <circle cx="1268" cy="269" r="13" />
      <circle cx="1281" cy="359" r="13" />
      <circle cx="1319" cy="444" r="13" />
      <circle cx="1377" cy="516" r="13" />
    </g>

    <g class="lobby-bulb-glow lobby-bulb-phase-a">
      <circle cx="1363" cy="13"  r="12" />
      <circle cx="1279" cy="174" r="12" />
      <circle cx="1281" cy="359" r="12" />
      <circle cx="1377" cy="516" r="12" />
    </g>

    <g class="lobby-bulb-glow lobby-bulb-phase-b">
      <circle cx="1311" cy="89"  r="12" />
      <circle cx="1268" cy="269" r="12" />
      <circle cx="1319" cy="444" r="12" />
    </g>
  </svg>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">KÍSÉRLETI LABOR</p>
        <h1>Szerencsekerék</h1>
      </div>
      <button id="endGameBtn" class="btn btn-danger">Játék vége</button>
    </header>

    <section id="setupScreen" class="panel setup-panel">
      <h2>Játékosok</h2>
      <p>Legalább két játékost válassz. Alapértelmezés: Krisz + Bot.</p>

      <div class="player-picker" aria-label="Játékosok kiválasztása">
        <label class="player-option">
          <input type="checkbox" value="Krisz" checked />
          <span class="avatar-frame">
            <img class="avatar-photo" src="assets/images/krisz.png" alt="Krisz profilképe" />
          </span>
          <strong>Krisz</strong>
        </label>

        <label class="player-option">
          <input type="checkbox" value="Adri" />
          <span class="avatar-frame">
            <img class="avatar-photo" src="assets/images/adri.png" alt="Adri profilképe" />
          </span>
          <strong>Adri</strong>
        </label>

        <label class="player-option">
          <input type="checkbox" value="Aliz" />
          <span class="avatar-frame">
            <img class="avatar-photo" src="assets/images/lizus.png" alt="Alíz profilképe" />
          </span>
          <strong>Alíz</strong>
        </label>

        <label class="player-option">
          <input type="checkbox" value="Bot" checked />
          <span class="avatar-frame">
            <img class="avatar-photo" src="assets/images/bot.png" alt="Bot profilképe" />
          </span>
          <strong>Bot</strong>
        </label>
      </div>

      <p id="setupError" class="error hidden">Legalább két játékos szükséges.</p>
      <button id="startGameBtn" class="btn btn-primary">Játék indítása</button>
    </section>

    <section id="gameScreen" class="stage-screen hidden">
      <div class="stage-canvas">
        <svg class="stage-puzzle-overlay"
             viewBox="0 0 1672 941"
             preserveAspectRatio="xMidYMid meet"
             aria-hidden="true"
             focusable="false">
          <defs>
            <linearGradient id="stageTileGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="58%" stop-color="#f9f7fb" />
              <stop offset="100%" stop-color="#e8e4ef" />
            </linearGradient>
          </defs>
          <g id="puzzleBoard"></g>
        </svg>

        <div class="stage-category-display">
          <strong id="categoryText">–</strong>
        </div>

        <div class="stage-used-display">
          <span>HASZNÁLT BETŰK</span>
          <strong id="usedLetters">–</strong>
        </div>

        <aside class="stage-current-player" aria-label="Aktuális játékos">
          <div class="stage-current-avatar-ring">
            <img id="stageCurrentAvatar"
                 src="assets/images/krisz.png"
                 alt="Aktuális játékos profilképe" />
          </div>
          <div class="stage-current-player-copy">
            <span>AKTUÁLIS JÁTÉKOS</span>
            <strong id="stageCurrentPlayerName">–</strong>
            <span class="stage-current-money-label">FORDULÓ</span>
            <strong id="stageCurrentMoney" class="stage-current-money">0 Ft</strong>
          </div>
        </aside>

        <div id="wheelResult" class="stage-basic-spin-result" aria-live="polite">–</div>

        <button id="spinBtn"
                type="button"
                class="stage-image-hotspot stage-spin-hotspot"
                aria-label="Pörgetés"></button>
        <button id="consonantStageBtn"
                type="button"
                class="stage-image-hotspot stage-consonant-hotspot"
                aria-label="Mássalhangzó"></button>
        <button id="solveBtn"
                type="button"
                class="stage-image-hotspot stage-solve-hotspot"
                aria-label="Megfejtés"></button>

        <div class="stage-test-answer" aria-label="Teszt megfejtés">
          TESZT: <strong id="testAnswerText">–</strong>
        </div>

        <div class="stage-logic-bridge" aria-hidden="true">
          <div id="playersList"></div>
          <strong id="activePlayerText">–</strong>
          <div id="wheelGame"></div>
          <p id="message"></p>
        </div>
      </div>
    </section>
  </main>

  <dialog id="solveDialog">
    <form method="dialog" id="solveForm">
      <h3>Megfejtés</h3>
      <p>Írd be a teljes feladványt.</p>
      <input id="solveInput" autocomplete="off" />
      <div class="dialog-actions">
        <button value="cancel" class="btn">Mégse</button>
        <button value="default" id="solveConfirmBtn" class="btn btn-primary">Megfejtem</button>
      </div>
    </form>
  </dialog>

  <dialog id="roundDialog">
    <form method="dialog">
      <h3 id="roundTitle">Forduló vége</h3>
      <p id="roundText"></p>
      <div class="dialog-actions">
        <button id="nextRoundBtn" value="default" class="btn btn-primary">Következő feladvány</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
